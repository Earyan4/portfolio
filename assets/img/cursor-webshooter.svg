<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Minimal Spider-Man thwip hand -->
  <g stroke="#1a1a1a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
    <!-- wrist -->
    <path d="M18 34v7c3.5 2 8.5 2 12 0v-7"/>
    <!-- palm -->
    <path d="M18 34c-2-5-2-11 0-15c2-3 7-5 12-4c4 1 7 4 8 9c1 4-1 8-4 10c-3 2-9 3-16 0z"/>
    <!-- thumb -->
    <path d="M18 24c-4-1-7 0-8 2.5c-1 2.5 1 5 4.5 6"/>
    <!-- index up -->
    <path d="M21 19c-1-5-2-10-2.5-13c0-1.2 2-1.4 2.8.2c1 2 2 7 2.5 11.5"/>
    <!-- pinky up -->
    <path d="M32 20c2-5 5-9 7.5-11.5c1-.8 2.2.4 1.6 1.6C39.5 13 36 18 34 21"/>
    <!-- middle folded -->
    <path d="M24 20c1.2 0 2 .8 2 2.5V30c-1.2.5-2.2.5-3 0v-7.5c0-1.5.6-2.5 1-2.5z"/>
    <!-- ring folded -->
    <path d="M28.5 20c1.2 0 2 .8 2 2.5V30c-1.2.5-2 .5-2.8 0v-7.5c0-1.5.5-2.5.8-2.5z"/>
  </g>
  <!-- single clean web strand -->
  <path d="M27 36c3-8 6-16 9-24" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M32 20c-1.5-4-4-7-6.5-9.5" stroke="#1a1a1a" stroke-width="1.15" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M32 20c2-4 5.5-7 9-9" stroke="#1a1a1a" stroke-width="1.15" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
